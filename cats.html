<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0284c7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kitty Adventure" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <title>Kitty Treat Cafe &amp; Cat Island Adventure!</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="top-toolbar">
      <div class="brand-title">
        <span id="brand-paw-icon" class="paw-icon">🐱</span>
        <h1 id="brand-heading">Kitty Treat Cafe &amp; Cat Island Adventure</h1>
      </div>
      <div class="toolbar-actions">
        <button id="btn-island-map" class="ui-btn primary-btn" type="button">
          🗺️ Island Map
        </button>
        <button id="btn-treat-shop" class="ui-btn shop-btn" type="button">
          🛍️ Treat Shop &amp; Closet
        </button>
        <button id="btn-theme-toggle" class="ui-btn kitty-btn" type="button" title="Switch between Pup Mode (71 Dogs) and Kitty Mode (32 Cats)">
          🐶 Pup Mode
        </button>
        <button id="btn-bakery-level" class="ui-btn accent-btn" type="button" title="Toggle Multi-Digit Addition vs Subtraction with Borrowing">
          🎂 Bakery: Add (Lvl 1)
        </button>
        <button id="btn-controller-style" class="ui-btn" type="button">
          🎮 8BitDo: SNES (X/Y/B/A)
        </button>
        <button id="btn-mute" class="ui-btn" type="button">
          🔊 Sound: ON
        </button>
      </div>
    </header>

    <main class="canvas-stage">
      <canvas id="game-canvas" width="960" height="600"></canvas>
    </main>

    <footer class="bottom-bar">
      <div id="gamepad-status" class="gamepad-pill">
        🕹️ Press any button on 8BitDo Controller (or use Keyboard / Mouse)
      </div>
      <div class="controls-legend">
        <span><strong>Walk:</strong> D-Pad / Left Stick / Arrows / WASD</span>
        <span>•</span>
        <span><strong>Answer Bowls:</strong> 8BitDo Face Buttons (X / Y / A / B) or Keys 1-4 / I-J-K-L / Click</span>
        <span>•</span>
        <span><strong>Island Map:</strong> Select / Backspace / Esc</span>
      </div>
    </footer>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
